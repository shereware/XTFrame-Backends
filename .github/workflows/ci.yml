name: CI

# XTFrame-Backends build and tests on every push and pull request: the runtime submodule (runtime/) plus the
# GPU backends, the full xtframe library (XT_BUILD_CAPI=ON in every preset), xtframe-view and
# xtframe-gpu-probe. Generated by Tools/Scripts/export_backends.sh in the XTFrame main repository (template
# Tools/Export/backends/ci.yml). The runtime's own sanitizer job runs in XTFrame-Runtime.
# WebGPU (runtime/Docs/design/10-backends.md section 10.10.3): every job runs Tools/Scripts/wgpu_tests.sh,
# which fails when the WebGPU tests found no adapter (windows: D3D12, WARP via XT_WGPU_FALLBACK=1; linux:
# Vulkan on lavapipe; macos: Metal).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    env:
      XT_WGPU_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: cmake --preset vs2022
      - name: Build Debug
        run: cmake --build --preset vs2022-debug
      - name: Test Debug
        run: ctest --preset vs2022-debug --output-on-failure
      - name: Build Release
        run: cmake --build --preset vs2022-release
      - name: Test Release
        run: ctest --preset vs2022-release --output-on-failure
      - name: Test wgpu (D3D12; WARP without a GPU)
        shell: bash
        run: bash Tools/Scripts/wgpu_tests.sh --preset vs2022-release
      - name: Upload corpus_check output
        # The renders a failed corpus_check produced, for a local diff against runtime/Tests/corpus/*/expected.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-actual-windows
          path: build/vs2022/runtime/Tests/corpus_work/*/actual/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: g++-12, cxx: g++-12 }
          - { pkg: clang, cxx: clang++ }
    env:
      CXX: ${{ matrix.cxx }}
      XT_WGPU_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.pkg }} \
            libgl1-mesa-dev libglu1-mesa-dev xvfb libx11-dev libxext-dev mesa-vulkan-drivers
      - name: Configure Debug
        run: cmake --preset ninja-ci-debug
      - name: Build Debug
        run: cmake --build --preset ninja-ci-debug
      - name: Test Debug
        run: xvfb-run -a ctest --preset ninja-ci-debug --output-on-failure
      - name: Configure Release
        run: cmake --preset ninja-ci-release
      - name: Build Release
        run: cmake --build --preset ninja-ci-release
      - name: Test Release
        run: xvfb-run -a ctest --preset ninja-ci-release --output-on-failure
      - name: Test wgpu (Vulkan, lavapipe)
        env:
          XT_WGPU_BACKEND: vulkan
        run: xvfb-run -a bash Tools/Scripts/wgpu_tests.sh --preset ninja-ci-release

  macos:
    continue-on-error: true
    runs-on: macos-latest
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install ninja
        run: brew install ninja
      - name: Configure Debug
        run: cmake --preset ninja-ci-debug
      - name: Build Debug
        run: cmake --build --preset ninja-ci-debug
      - name: Test Debug
        run: ctest --preset ninja-ci-debug --output-on-failure
      - name: Configure Release
        run: cmake --preset ninja-ci-release
      - name: Build Release
        run: cmake --build --preset ninja-ci-release
      - name: Test Release
        run: ctest --preset ninja-ci-release --output-on-failure
      - name: Test wgpu (Metal)
        run: bash Tools/Scripts/wgpu_tests.sh --preset ninja-ci-release
